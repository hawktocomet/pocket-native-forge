[package]
name = "pocket-recompiler-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "native/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
recomp3ds = { path = "vendor/pocket-native/recompiler", default-features = false }

[[bin]]
name = "generate-test"
path = "tools/generate_test.rs"

[[bin]]
name = "pocket-recompile"
path = "tools/recompile.rs"

[[bin]]
name = "pocket-recompiler-device"
path = "tools/device_engine.rs"
