plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.pocketrecompiler'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.pocketrecompiler'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}
